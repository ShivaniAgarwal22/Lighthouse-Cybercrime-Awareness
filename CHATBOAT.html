<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LIGHTHOUSE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: white;
        color: #1e293b;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* HEADER */
      .header-top {
        background-color: #2196f3;
        color: white;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header-left {
        display: flex;
        align-items: center;
      }
      .header-left img {
        height: 60px;
        margin-right: 15px;
      }
      .header-left h1 {
        margin: 0;
        font-size: 22px;
      }
      .header-left p {
        margin: 0;
        font-size: 14px;
      }
      .language-select {
        background-color: white;
        color: black;
        padding: 5px;
        border-radius: 4px;
        font-weight: 600;
      }

      /* NAVBAR */
      .nav-bar {
        background-color: #0b3d91;
        display: flex;
        justify-content: center;
        padding: 12px 0;
        gap: 25px;
      }
      .nav-bar a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        font-size: 15px;
        transition: color 0.3s;
      }
      .nav-bar a:hover {
        color: #ffcc00;
      }

      /* CHATBOX */
      .chatbox {
        flex: 1;
        width: 90%;
        max-width: 750px;
        background: pink;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        height: 75vh;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        margin: 20px auto;
        border: 1px solid peachpuff;
      }
      .history {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        scroll-behavior: smooth;
      }
      .msg {
        margin: 8px 0;
        padding: 12px 16px;
        border-radius: 14px;
        max-width: 75%;
        line-height: 1.4;
        animation: fadeIn 0.3s ease;
        word-wrap: break-word;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .user {
        background: lightcyan;
        color: lightseagreen;
        align-self: flex-end;
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
      }
      .bot {
        background: #639de9;
        color: #1e293b;
        align-self: flex-start;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      /* INPUT AREA */
      .input-area {
        display: flex;
        border-top: 1px solid #e2e8f0;
        background: #f1f5f9;
        padding: 12px;
        gap: 10px;
      }
      textarea {
        flex: 1;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        resize: none;
        outline: none;
        background: white;
        color: #1e293b;
        font-size: 14px;
      }
      textarea:focus {
        border-color: #2563eb;
      }
      button {
        padding: 0 18px;
        background: linear-gradient(135deg, #2563eb, #9333ea);
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 12px;
        font-weight: 600;
        transition: transform 0.2s, background 0.3s;
      }
      button:hover {
        transform: scale(1.05);
        background: linear-gradient(135deg, #1d4ed8, #7e22ce);
      }

      /* Typing dots */
      .thinking {
        display: flex;
        gap: 4px;
        padding: 12px 16px;
        border-radius: 14px;
        background: #7aabec;
        width: 50px;
        justify-content: center;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #6c8ebd;
        animation: bounce 1s infinite;
      }
      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0.8);
        }
        40% {
          transform: scale(1.2);
        }
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <div class="header-top">
      <div class="header-left">
        <img
          src="logo.jpeg"
          alt="CyberShield Logo"
          class="logo"
        />
        <div>
          <h1 id="headerTitle"></h1>
          <p id="headerSubtitle"></p>
        </div>
      </div>
      <select class="language-select" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="mr">मराठी</option>
      </select>
    </div>
    

    <!-- NAVBAR -->
    <div class="nav-bar" id="navbar">
      <a href="secoand.html" data-en="Login" data-hi="लॉगिन" data-mr="लॉगिन"
        >Login</a
      >
      <a
        href="thierd.html"
        data-en="Recent News"
        data-hi="हाल की खबरें"
        data-mr="ताज्या बातम्या"
        >Recent News</a
      >
      <a
        href="forth.html"
        data-en="Types of Crime"
        data-hi="साइबर अपराध और भुगतान"
        data-mr="सायबर गुन्हे आणि पेमेंट"
        >Cybercrime & E-Payment</a
      >
      <a href="fourth 2.html"
        data-en="How to Face"
        data-hi="कैसे सामना करें"
        data-mr="कसे सामोरे जावे"
        >How to Face</a
      >
      <a href="CHATBOAT.HTML" data-en="Solution" data-hi="समाधान" data-mr="उपाय"
        >Solution</a
      >
      <a href="map.html" data-en="Map" data-hi="नक्शा" data-mr="नकाशा">Map</a>
      <a
        href="sixth.html"
        data-en="Helpline Number"
        data-hi="हेल्पलाइन नंबर"
        data-mr="हेल्पलाइन नंबर"
        >Helpline Number</a
      >
      <a
        href="feedback.html"
        data-en="Feedback"
        data-hi="प्रतिक्रिया"
        data-mr="अभिप्राय"
        >Feedback</a
      >
    </div>

    <!-- CHATBOX -->
    <div class="chatbox">
      <div class="history" id="history"></div>
      <div class="input-area">
        <textarea id="input" placeholder="Type your message..."></textarea>
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <script>
      const historyEl = document.getElementById("history");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("sendBtn");

      const API_KEY ="Add Your API Key"; 

      function appendMessage(text, from) {
        const div = document.createElement("div");
        div.className = "msg " + from;
        if (from === "bot") {
          div.textContent = "🤖 " + text;
        } else {
          div.textContent = text;
        }
        historyEl.appendChild(div);
        historyEl.scrollTop = historyEl.scrollHeight;
      }

      function showThinking() {
        const div = document.createElement("div");
        div.className = "msg bot thinking";
        div.innerHTML =
          '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        historyEl.appendChild(div);
        historyEl.scrollTop = historyEl.scrollHeight;
      }

      async function callAI(message) {
        showThinking();

        try {
          const res = await fetch(
            "https://api.openai.com/v1/chat/completions",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + API_KEY,
              },
              body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [
                  {
                    role: "system",
                    content: "You are ChatBoat, a friendly helpful AI.",
                  },
                  { role: "user", content: message },
                ],
              }),
            }
          );
          const data = await res.json();
          const thinkingEl = document.querySelector(".thinking");

          if (thinkingEl) {
            thinkingEl.remove();
          }

          if (data && Array.isArray(data.choices) && data.choices.length > 0) {
            const reply = data.choices[0].message?.content;
            if (reply !== undefined && reply !== null) {
              appendMessage(reply, "bot");
            } else {
              appendMessage(
                "⚠ Error: Unexpected response format (no message content)",
                "bot"
              );
              console.error("Unexpected response content:", data);
            }
          } else {
            // No choices available — likely an error object
            let errMsg = "⚠ Error: No choices in response";
            if (data && data.error && data.error.message) {
              errMsg = "⚠ Error: " + data.error.message;
            }
            appendMessage(errMsg, "bot");
            console.error("Chat API returned:", data);
          }
        } catch (err) {
          const thinkingEl = document.querySelector(".thinking");
          if (thinkingEl) thinkingEl.remove();

          appendMessage("⚠ Error: " + err.message, "bot");
          console.error("Fetch or parsing error:", err);
        }
      }

      sendBtn.addEventListener("click", () => {
        const text = inputEl.value.trim();
        if (!text) return;
        appendMessage(text, "user");
        inputEl.value = "";
        callAI(text);
      });

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendBtn.click();
        }
      });

      // 🔹 Language Change Function
      function changeLanguage(lang) {
        const translations = {
          en: {
            title: "CyberShield with AI",
            subtitle: "Your Trusted Digital Guardian",
            placeholder: "Type your message...",
            button: "Send",
          },
          hi: {
            title: "",
            subtitle: "",
            placeholder: "अपना संदेश टाइप करें...",
            button: "भेजें",
          },
          mr: {
            title: "",
            subtitle: "",
            placeholder: "आपला संदेश टाइप करा...",
            button: "पाठवा",
          },
        };

        const t = translations[lang];
        document.getElementById("headerTitle").innerText = t.title;
        document.getElementById("headerSubtitle").innerText = t.subtitle;
        document.getElementById("input").placeholder = t.placeholder;
        document.getElementById("sendBtn").innerText = t.button;

        document.querySelectorAll(".nav-bar a").forEach((a) => {
          a.innerText = a.dataset[lang];
        });
      }
    </script>
  </body>
</html>
