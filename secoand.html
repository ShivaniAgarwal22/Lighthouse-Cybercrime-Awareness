<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LIGHTHOUSE</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #e6f0ff;
    }

    /* Header */
    .header-top {
      background-color: #2196F3;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .header-left img {
      height: 70px;
      margin-right: 15px;
    }

    .header-left h1 {
      margin: 0;
      font-size: 24px;
    }

    .header-left p {
      margin: 0;
      font-size: 14px;
    }

    .language-select {
      background-color: white;
      color: black;
      padding: 5px;
      border-radius: 4px;
    }

    /* Form Container */
    .form-container {
      width: 350px;
      margin: 60px auto;
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form-container h2 {
      text-align: center;
      color: #007bff;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* Popup */
    .popup {
      display: none;
      background-color: rgba(0,0,0,0.5);
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .popup-content {
      background-color: white;
      padding: 20px 30px;
      border-radius: 8px;
      text-align: center;
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-top">
    <div class="header-left">
      <img src="logo.jpeg" alt="Cyber Crime Logo" />
      <div>
        <h1></h1>
        <p></p>
      </div>
    </div>
    <select class="language-select" onchange="changeLanguage(this.value)">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="mr">मराठी</option>
    </select>
  </div>

  <!-- User Login Form -->
  <div class="form-container">
    <h2 id="loginTitle">User Login</h2>
    <form id="userForm" onsubmit="return validatePassword()">
      <input type="text" id="username" placeholder="Username">
      <div style="position: relative;">
        <input type="password" id="password" placeholder="Password">
        <span onclick="togglePassword()" id="eyeIcon"
              style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:18px;">
          👁️
        </span>
      </div>
      <button type="submit" id="loginBtn">Login</button>
    </form>
  </div>

  <!-- Popup -->
  <div class="popup" id="popup">
    <div class="popup-content" id="popupMsg">Invalid Password!</div>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.textContent = "🙈";
      } else {
        passwordInput.type = "password";
        eyeIcon.textContent = "👁️";
      }
    }

    function changeLanguage(lang) {
      if (lang === "hi") {
        document.getElementById("loginTitle").innerText = "उपयोगकर्ता लॉगिन";
        document.getElementById("username").placeholder = "उपयोगकर्ता नाम";
        document.getElementById("password").placeholder = "पासवर्ड";
        document.getElementById("loginBtn").innerText = "लॉगिन करें";
      } else if (lang === "mr") {
        document.getElementById("loginTitle").innerText = "वापरकर्ता लॉगिन";
        document.getElementById("username").placeholder = "वापरकर्ता नाव";
        document.getElementById("password").placeholder = "पासवर्ड";
        document.getElementById("loginBtn").innerText = "लॉगिन";
      } else {
        document.getElementById("loginTitle").innerText = "User Login";
        document.getElementById("username").placeholder = "Username";
        document.getElementById("password").placeholder = "Password";
        document.getElementById("loginBtn").innerText = "Login";
      }
    }

    // ✅ Password validation and redirect
    function validatePassword() {
      const password = document.getElementById("password").value.trim();

      // At least 6 characters, one uppercase, one lowercase, one number, one special character
      const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%?&])[A-Za-z\d@$!%?&]{6,}$/;
      if (!passwordRegex.test(password)) {
        showPopup("⚠️ Password must have at least 6 characters, 1 uppercase, 1 lowercase, 1 number & 1 special character.");
        return false; // stop form
      }

      // Redirect to next page if password valid
      window.location.href = "thierd.html";
  
      return false;
    }

    function showPopup(msg) {
      document.getElementById("popupMsg").innerText = msg;
      document.getElementById("popup").style.display = "flex";
      setTimeout(() => {
        document.getElementById("popup").style.display = "none";
      }, 2500);
    }
  </script>
</body>
</html>
