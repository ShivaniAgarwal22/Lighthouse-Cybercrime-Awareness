<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    /* Header */
    .header {
      background: #2196F3;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header img.logo {
      height: 90px;
      margin-right: 15px;
    }

    .header .title {
      font-size: 22px;
      font-weight: bold;
    }

    .header .slogan {
      font-size: 14px;
    }

    .lang-select {
      padding: 5px;
      border-radius: 5px;
      border: none;
    }

    /* Navbar */
    .navbar {
      display: flex;
      background: #0d47a1;
      padding: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      font-weight: bold;
    }

    .navbar a:hover {
      background: #1976D2;
      border-radius: 5px;
    }

    /* GRID CONTAINER */
    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    /* CARD DESIGN */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin: 10px 0;
      font-size: 18px;
    }

    /* Responsive */
    @media (max-width: 992px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div style="display: flex; align-items: center;">
      <img src="logo.jpeg" alt="CyberShield Logo" class="logo">
      <div>
        <div class="title" data-key="title"></div>
        <div class="slogan" id="slogan" data-key="slogan"></div>
      </div>
    </div>

    <select class="lang-select" onchange="changeLanguage(this.value)">
      <option value="en">English</option>

  <!-- Navbar -->

    <a href="fourth2.html" onclick="checkLogin(event)" data-key="howto">How to Face</a>
    <a href="CHATBOAT.HTML" onclick="checkLogin(event)" data-key="solution">Solution</a>
    <a href="map.html" onclick="checkLogin(event)" data-key="map">Map</a>

    <a href="seven.html" onclick="checkLogin(event)" data-key="feedback">Feedback</a>
  </div>

  <!-- Main Section -->
  <div class="container">

    <div class="card">
      <img src="FF.jpeg" alt="Financial Fraud">
      <h3>Financial Fraud</h3>
    </div>

    <div class="card">
      <img src="Hacking & Data Theft.jpg" alt="Hacking & Data Theft">
      <h3>Hacking & Data Theft</h3>
    </div>

    <div class="card">
      <img src="W&C SAFETY.jpeg" alt="Women/Children Safety">
      <h3>Women/Children Safety</h3>
    </div>

    <div class="card">
      <img src="AI.webp" alt="AI Phishing">
      <h3>AI-powered phishing attacks</h3>
    </div>

    <div class="card">
      <img src="Identity-theft.jpeg" alt="Identity Theft">
      <h3>Identity-theft</h3>
    </div>

    <div class="card">
      <img src="RANSOMWARE.jpeg" alt="Ransomware">
      <h3>Ransomware attacks</h3>
    </div>

  </div>

  <script>
    const translations = {
      en: { title: "", slogan: "", login: "Login", recentNews: "Recent News", types: "Cybercrime & E-Payment", howto: "How to Face", solution: "Solution", map: "Map", helpline: "Helpline Number", feedback: "Feedback" },
      hi: { title: "", slogan: "", login: "लॉगिन", recentNews: "ताज़ा खबरें", types: "साइबर अपराध के प्रकार", howto: "कैसे सामना करें", solution: "समाधान", map: "मानचित्र", helpline: "हेल्पलाइन नंबर", feedback: "प्रतिक्रिया" },
      mr: { title: "", slogan: "", login: "लॉगिन", recentNews: "ताज्या बातम्या", types: "सायबर गुन्हे आणि पेमेंट", howto: "कसे सामोरे जावे", solution: "उपाय", map: "नकाशा", helpline: "हेल्पलाईन नंबर", feedback: "अभिप्राय" }
    };

    function changeLanguage(lang) {
      document.querySelectorAll("[data-key]").forEach(el => {
        const key = el.getAttribute("data-key");
        el.innerText = translations[lang][key];
      });
    }

    function checkLogin(event) {
      if (!localStorage.getItem("isLoggedIn")) {
        event.preventDefault();
        alert("⚠️ Please login first to access this page!");
        window.location.href = "secoand.html";
      }
    }
  </script>
